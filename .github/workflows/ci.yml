name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: plugin
    steps:
      - name: Check out plugin
        uses: actions/checkout@v6
        with:
          path: plugin
          persist-credentials: false
      - name: Check out matching Paseo release
        uses: actions/checkout@v6
        with:
          repository: getpaseo/paseo
          ref: 7c1958f5b0a4ae9f2cb12f77b0a754a644cd0081 # v0.9.0-beta.1
          path: paseo
          persist-credentials: false
      - name: Check out reference ZCode source
        uses: actions/checkout@v6
        with:
          repository: zai-org/ZCode
          ref: 872ad960de7ec172591f7e1952f7849229f94521
          path: zcode-source
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: plugin/package-lock.json
      - name: Install dependencies and generate build metadata
        run: npm ci --include=dev
      - name: Verify vendored official contracts
        run: npm run check:zcode-source -- "$GITHUB_WORKSPACE/zcode-source"
      - name: Check types
        run: npm run typecheck
      - name: Run unit tests
        run: npm test
      - name: Build plugin
        run: npm run build
      - name: Check Git preparation and upstream integration
        run: npm run test:upstream -- "$GITHUB_WORKSPACE/paseo"

  runtime:
    name: Official stdio runtime contract
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          path: plugin
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          repository: zai-org/ZCode
          ref: 872ad960de7ec172591f7e1952f7849229f94521
          path: zcode-source
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24.14.0"
      - uses: pnpm/action-setup@v4
        with:
          version: "10.33.2"
      - name: Build the official integrated CLI
        working-directory: zcode-source
        run: |
          pnpm install --frozen-lockfile
          pnpm exec tsc -b packages/shared
          node scripts/build-zcode.mjs --base-url https://example.invalid/zcode/
      - name: Extract outside the source checkout
        run: |
          mkdir "$RUNNER_TEMP/zcode-runtime"
          sha256sum zcode-source/dist/zcode/releases/3.14.0/zcode-3.14.0.tar.gz
          tar -xzf zcode-source/dist/zcode/releases/3.14.0/zcode-3.14.0.tar.gz -C "$RUNNER_TEMP/zcode-runtime"
          echo "PASEO_ZCODE_RUNTIME=$RUNNER_TEMP/zcode-runtime/zcode" >> "$GITHUB_ENV"
          echo "PASEO_ZCODE_NODE=$(command -v node)" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: zcode-runtime-linux-x64
          path: zcode-source/dist/zcode/releases/3.14.0/zcode-3.14.0.tar.gz
      - name: Install plugin dependencies
        working-directory: plugin
        run: npm ci --include=dev
      - name: Verify Provider behavior on the official runtime
        working-directory: plugin
        # Resume uses Paseo's saved mode and Plan settings (ADR 14).
        # The separate test:native-restore tracks unsupported settings-free resume.
        run: npm run test:stdio-runtime

  e2e:
    name: Real ZCode E2E
    needs: runtime
    if: >-
      github.actor != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24.14.0"
          cache: npm
      - uses: actions/download-artifact@v4
        with:
          name: zcode-runtime-linux-x64
          path: runtime-archive
      - name: Configure official runtime
        run: |
          mkdir "$RUNNER_TEMP/zcode-runtime"
          tar -xzf runtime-archive/zcode-3.14.0.tar.gz -C "$RUNNER_TEMP/zcode-runtime"
          echo "PASEO_ZCODE_RUNTIME=$RUNNER_TEMP/zcode-runtime/zcode" >> "$GITHUB_ENV"
          echo "PASEO_ZCODE_NODE=$(command -v node)" >> "$GITHUB_ENV"
      - name: Install dependencies
        run: npm ci --include=dev
      - name: Run isolated real-model E2E
        env:
          GLM_API_KEY: ${{ secrets.GLM_API_KEY }}
        run: npm run test:e2e
