name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: plugin
    steps:
      - name: Check out plugin
        uses: actions/checkout@v6
        with:
          path: plugin
          persist-credentials: false
      - name: Check out matching Paseo release
        uses: actions/checkout@v6
        with:
          repository: getpaseo/paseo
          ref: cafe4b01c8522ff39560241c5deb01427dc8dc5b # v0.12.0
          path: paseo
          persist-credentials: false
      - name: Check out reference ZCode source
        uses: actions/checkout@v6
        with:
          repository: zai-org/ZCode
          ref: 3c5b227649371507ddc4eb46ac5133afe6db1cab # 3.16.2 (untagged main)
          path: zcode-source
          persist-credentials: false
      - name: Install dependencies and generate build metadata
        uses: ./plugin/.github/actions/setup-node-deps
        with:
          node-version: "22"
          working-directory: plugin
          cache-dependency-path: plugin/package-lock.json
      - name: Verify vendored official contracts
        run: npm run check:zcode-source -- "$GITHUB_WORKSPACE/zcode-source"
      - name: Check that the runtime patches apply (ADR 19)
        run: npm run check:zcode-patches -- "$GITHUB_WORKSPACE/zcode-source"
      - name: Check types
        run: npm run typecheck
      - name: Run unit tests
        run: npm test
      - name: Build plugin
        run: npm run build
      - name: Check Git and npm installation and upstream integration
        run: npm run test:upstream -- "$GITHUB_WORKSPACE/paseo"

  runtime:
    name: Managed runtime contract (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            runner: macos-15
          - target: linux-x64
            runner: ubuntu-24.04
          - target: linux-arm64
            runner: ubuntu-24.04-arm
          - target: win-x64
            runner: windows-2025
          - target: win-arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      # The plugin runs on the daemon's Node.js; ZCode uses the managed Node.js.
      - name: Install plugin dependencies
        uses: ./.github/actions/setup-node-deps
        with:
          node-version: "22"
      - name: Install the pinned managed runtime (ADR 15)
        run: |
          data=$(node -p "require('node:path').join(process.env.RUNNER_TEMP, 'zcode-data')")
          echo "XDG_DATA_HOME=$data" >> "$GITHUB_ENV"
          XDG_DATA_HOME="$data" npm run setup:managed-runtime
      - name: Verify Provider behavior on the managed runtime
        # Resume uses Paseo's saved mode and Plan settings (ADR 14).
        # The separate test:native-restore tracks unsupported settings-free resume.
        run: npm run test:stdio-runtime

  e2e:
    name: Real ZCode E2E
    needs: runtime
    if: >-
      github.actor != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install dependencies
        uses: ./.github/actions/setup-node-deps
        with:
          node-version: "22"
      - name: Install the pinned managed runtime
        run: |
          echo "XDG_DATA_HOME=$RUNNER_TEMP/zcode-data" >> "$GITHUB_ENV"
          XDG_DATA_HOME="$RUNNER_TEMP/zcode-data" npm run setup:managed-runtime
      - name: Run isolated real-model E2E
        env:
          GLM_API_KEY: ${{ secrets.GLM_API_KEY }}
        run: npm run test:e2e
